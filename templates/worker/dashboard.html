{% extends "base.html" %}

{% block content %}
<div id="auth-guard" data-requires-auth="true" data-allowed-roles="service_worker" data-page-name="Worker Dashboard" style="display: none;"></div>

<div class="dashboard-header" style="border-bottom: 2px solid var(--primary-color); padding-bottom: 1rem; margin-bottom: 2rem;">
    <h2>Service Worker Dashboard</h2>
    <p>View assigned tasks and upload proof of work.</p>
</div>

<div id="worker-error" class="alert alert-error" style="display: none;"></div>

<div id="worker-complaints-list">
    <p class="text-muted">Loading your assigned complaints...</p>
</div>

<!-- Load Worker JS -->
<script src="{{ url_for('static', filename='js/worker.js') }}"></script>
{% endblock %}
