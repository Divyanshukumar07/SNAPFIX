{% extends "base.html" %}

{% block content %}
<!-- Add data attribute to indicate this route requires auth -->
<div id="auth-guard" data-requires-auth="true" data-allowed-roles="citizen,service_worker,department_head,city_admin,main_authority" data-page-name="My Complaints" style="display: none;"></div>

<div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
    <div>
        <h2 style="font-size: 2.25rem; font-weight: 700; color: var(--primary-color); margin-bottom: 0.25rem;">My Complaints</h2>
        <p class="text-muted">Manage your complaints and track their status.</p>
    </div>
    <a href="/complaints/new" class="btn btn-primary" id="new-complaint-btn">Submit New Complaint</a>
</div>

<div id="verification-banner" class="alert alert-warning" style="display: none; border-radius: var(--radius-lg); margin-bottom: 2rem;">
    <strong>Action Required:</strong> Please verify your email address to submit complaints. 
    <button id="resend-verification-btn" class="btn btn-secondary btn-sm" style="margin-left: 10px;">Resend Verification Email</button>
</div>

<div style="border: none; box-shadow: none; padding: 0;">
    <div id="complaints-list" class="complaints-grid" style="display: grid; gap: 1.5rem;">
        <div class="skeleton" style="height: 160px; width: 100%;"></div>
    </div>
</div>

<!-- Edit Complaint Modal -->
<div id="edit-complaint-modal" class="snapfix-modal-overlay" style="display: none;">
    <div class="snapfix-modal">
        <div class="snapfix-modal-header">
            <h3>Edit Complaint</h3>
            <button class="snapfix-modal-close" onclick="closeEditModal()">&times;</button>
        </div>
        <div class="snapfix-modal-body">
            <p class="text-muted" style="margin-bottom: 1rem; font-size: 0.9rem;">You can only edit your complaint before it is verified.</p>
            <div class="form-group">
                <label>Description (Please provide details)</label>
                <textarea id="edit-complaint-desc" rows="5"></textarea>
            </div>
        </div>
        <div class="snapfix-modal-footer">
            <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
            <button class="btn btn-primary" id="btn-save-edit" onclick="saveComplaintEdit()">Save Changes</button>
        </div>
    </div>
</div>
{% endblock %}
