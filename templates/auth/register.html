{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <h2>Register</h2>
        <p class="text-muted">Create a new SnapFix account</p>
        
        <div id="register-error" class="alert alert-error" style="display: none;"></div>
        <div id="register-success" class="alert alert-success" style="display: none;"></div>
        
        <form id="register-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" id="register-btn" class="btn btn-primary btn-block">Register</button>
        </form>
        
        <p class="auth-redirect">
            Already have an account? <a href="/login">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
