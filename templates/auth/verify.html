{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card" style="text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">✉️</div>
        <h2>Verify your email</h2>
        <p class="text-muted" style="margin-bottom: 0.5rem;">Verification email sent to:</p>
        <p><strong id="verify-email-display" style="font-size: 1.1rem;"></strong></p>
        
        <p class="text-muted" style="margin-top: 1.5rem; margin-bottom: 2rem;">
            Please check your inbox and click the verification link to activate your account.
        </p>

        <div id="verify-error" class="alert alert-error" style="display: none; text-align: left;"></div>
        <div id="verify-success" class="alert alert-success" style="display: none; text-align: left;"></div>

        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <button id="btn-check-verify" class="btn btn-primary btn-block">I've Verified My Email</button>
            <button id="btn-resend-verify" class="btn btn-secondary btn-block">Resend Verification Email</button>
        </div>

        <p class="auth-redirect" style="margin-top: 2rem;">
            <a href="#" id="btn-back-login">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
